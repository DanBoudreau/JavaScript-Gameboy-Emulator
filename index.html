<html>
    <head>
        <style>
            body {
                margin: 0;
                padding: 24px;
                background: #d9e2c7;
                color: #1f2a16;
                font-family: "Courier New", monospace;
            }

            #screen {
                display: block;
                width: 480px;
                height: 432px;
                image-rendering: pixelated;
                background: #9bbc0f;
                border: 4px solid #1f2a16;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
                margin-bottom: 16px;
            }

            .audio-controls {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 12px 0;
            }

            .audio-controls label {
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            .audio-toggle {
                display: inline-flex;
                align-items: center;
                gap: 10px;
            }

            .audio-toggle input {
                position: absolute;
                opacity: 0;
                pointer-events: none;
            }

            .audio-switch {
                position: relative;
                width: 48px;
                height: 28px;
                border-radius: 999px;
                background: #b54a3a;
                border: 2px solid #1f2a16;
                transition: background 0.18s ease;
                box-sizing: border-box;
                cursor: pointer;
            }

            .audio-switch::after {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: #f2f5ea;
                transition: transform 0.18s ease;
            }

            .audio-toggle input:checked + .audio-switch {
                background: #5f7f1c;
            }

            .audio-toggle input:checked + .audio-switch::after {
                transform: translateX(20px);
            }
        </style>
        <script type="text/javascript" src="RomReader.js"></script>
        <script type="text/javascript" src="GPU.js"></script>
        <script type="text/javascript" src="APU.js"></script>
        <script type="text/javascript" src="MMU.js"></script>
        <script type="text/javascript" src="Keys.js"></script>
        <script type="text/javascript" src="GB_Z80.js"></script>
        <script type="text/javascript" src="GameBoy.js"></script>
        <script type="text/javascript" src="Timers.js"></script>
    </head>
    <body>
    <canvas id = "screen" width = "160" height="144"></canvas>
    <br>
    <div id="keyDisplay" style="font-family: monospace; font-size: 14px; margin: 10px 0; border: 1px solid #ccc; padding: 10px; width: 300px; height: 100px; overflow-y: auto; background-color: #f0f0f0;">
        Press keys to see input here...
    </div>
    <br>
    <input type="file" id="romfile" accept=".gb">
    <br>
    <div class="audio-controls">
        <label class="audio-toggle" for="audio">
            <span>Audio</span>
            <input type="checkbox" id="audio">
            <span class="audio-switch" aria-hidden="true"></span>
        </label>
        <label for="volume">
            Volume
            <input type="range" id="volume" min="0" max="50" value="18">
        </label>
    </div>
    <br>
    <a id="reset">Reset</a>   |   <a id="run">Run</a>
    </body>
</html>
