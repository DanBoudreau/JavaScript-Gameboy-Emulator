<html>
    <head>
        <style>
            body {
                margin: 0;
                padding: 24px;
                background: #d9e2c7;
                color: #1f2a16;
                font-family: "Courier New", monospace;
            }

            #screen {
                display: block;
                width: 480px;
                height: 432px;
                image-rendering: pixelated;
                background: #9bbc0f;
                border: 4px solid #1f2a16;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
                margin-bottom: 16px;
            }

            .audio-controls {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 12px 0;
            }

            .audio-controls label {
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }
        </style>
        <script type="text/javascript" src="scripts/RomReader.js"></script>
        <script type="text/javascript" src="scripts/GPU.js"></script>
        <script type="text/javascript" src="scripts/APU.js"></script>
        <script type="text/javascript" src="scripts/MMU.js"></script>
        <script type="text/javascript" src="scripts/Keys.js"></script>
        <script type="text/javascript" src="scripts/GB_Z80.js"></script>
        <script type="text/javascript" src="scripts/GameBoy.js"></script>
        <script type="text/javascript" src="scripts/Timers.js"></script>
    </head>
    <body>
    <canvas id = "screen" width = "160" height="144"></canvas>
    <br>
    <div id="keyDisplay" style="font-family: monospace; font-size: 14px; margin: 10px 0; border: 1px solid #ccc; padding: 10px; width: 300px; height: 100px; overflow-y: auto; background-color: #f0f0f0;">
        Press keys to see input here...
    </div>
    <br>
    <input type="file" id="romfile" accept=".gb">
    <br>
    <div class="audio-controls">
        <button id="audio">Enable Audio</button>
        <label for="volume">
            Volume
            <input type="range" id="volume" min="0" max="100" value="18">
        </label>
    </div>
    <br>
    <a id="reset">Reset</a>   |   <a id="run">Run</a>
    </body>
</html>
